<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker API</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            text-align:center;
            margin-top:50px;
        }
        .container{
            width:60%;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
        }
        h1{
            color:#2c3e50;
        }
        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }
        th,td{
            border:1px solid #ddd;
            padding:10px;
        }
        th{
            background:#007BFF;
            color:white;
        }
        a{
            text-decoration:none;
            color:#007BFF;
            font-weight:bold;
        }
        .form-group{
    margin:20px 0;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:250px;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

button{
    padding:10px 20px;
    margin-left:10px;
    background:#007BFF;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}
    </style>
</head>
<body>
    <a href="/add">
    <button>Add New Expense</button>
</a>


<a href="/delete">
    <button style="background:red;color:white;">
        Delete Expense
    </button>
</a>

<div class="container">
    <h1>💰 Personal Expense Tracker API</h1>
    <h2>Search Expenses</h2>

<div class="form-group">
    <label for="expenseId"><b>Expense ID</b></label><br>
    <input type="number" id="expenseId" placeholder="Enter exp__id">
    <button onclick="searchById()"> Search by exp__id  </button>
</div>

<div style="margin-bottom:20px;">
    <input type="text" id="category" placeholder="Enter Category">
    <button onclick="searchByCategory()">Search by Category</button>
</div>

<div id="result" style="margin-top:20px; text-align:left;"></div>
<div style="margin-bottom:20px;">
    <button onclick="getTotalExpenses()">Calculate Total Expenses</button>
    <button onclick="groupByCategory()">Group by Category</button>
</div>

<div id="totalResult" style="margin-top:20px;"></div>
<div id="groupResult" style="margin-top:20px;"></div>

<script>
function searchById() {

    let id = document.getElementById("expenseId").value;

    fetch(`/expenses/${id}`)
        .then(response => response.json())
        .then(expense => {

            let html = `
                <table>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Amount (₹)</th>
                        <th>Category</th>
                        <th>Date</th>
                    </tr>

                    <tr>
                        <td>${expense.id}</td>
                        <td>${expense.title}</td>
                        <td>₹${expense.amount}</td>
                        <td>${expense.category}</td>
                        <td>${expense.date}</td>
                    </tr>
                </table>
            `;

            document.getElementById("result").innerHTML = html;
        });
}

function searchByCategory() {
    let category = document.getElementById("category").value;

    if (category === "") {
        alert("Please enter a category");
        return;
    }

    fetch(`/expenses/category/${category}`)
        .then(response => response.json())
        .then(data => {

            if (data.message) {
                document.getElementById("result").innerHTML =
                    "<h3>" + data.message + "</h3>";
                return;
            }

            let html = `
                <h2>${category.toUpperCase()} Expenses</h2>

                <table>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Amount (₹)</th>
                        <th>Category</th>
                        <th>Date</th>
                    </tr>
            `;

            let total = 0;

            data.forEach(expense => {
                total += expense.amount;

                html += `
                    <tr>
                        <td>${expense.id}</td>
                        <td>${expense.title}</td>
                        <td>₹${expense.amount}</td>
                        <td>${expense.category}</td>
                        <td>${expense.date}</td>
                    </tr>
                `;
            });

            html += `
                <tr style="background:#f2f2f2;font-weight:bold;">
                    <td colspan="2">Total</td>
                    <td>₹${total}</td>
                    <td colspan="2"></td>
                </tr>
            `;

            html += "</table>";

            document.getElementById("result").innerHTML = html;
        });
        }
</script>

    <p>Welcome to the Expense Tracker REST API.</p>

    <table>
        <tr>
            <th>To see json file</th>
            
        </tr>

        <tr>
            
            <td><a href="/expenses">Expenses</a></td>
            
        </tr>

        

        


    </table>

</div>
<script>
function getTotalExpenses() {
    fetch("/expenses/total")
        .then(response => response.json())
        .then(data => {

            let html = `
                <h2>Expense Summary</h2>
                <h3>Overall Total: ₹${data.overall_total}</h3>

                <table>
                    <tr>
                        <th>Category</th>
                        <th>Total Amount</th>
                    </tr>
            `;

            for (let category in data.category_totals) {
                html += `
                    <tr>
                        <td>${category}</td>
                        <td>₹${data.category_totals[category]}</td>
                    </tr>
                `;
            }

            html += "</table>";

            document.getElementById("totalResult").innerHTML = html;
            document.getElementById("groupResult").innerHTML = "";
        });
}

function groupByCategory() {
    fetch("/expenses/group")
        .then(response => response.json())
        .then(data => {

            let html = "<h2>Expenses Grouped by Category</h2>";

            for (let category in data) {

                html += `
                    <h3>${category} (Total: ₹${data[category].total})</h3>

                    <table>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Amount</th>
                            <th>Date</th>
                        </tr>
                `;

                data[category].expenses.forEach(expense => {
                    html += `
                        <tr>
                            <td>${expense.id}</td>
                            <td>${expense.title}</td>
                            <td>₹${expense.amount}</td>
                            <td>${expense.date}</td>
                        </tr>
                    `;
                });

                html += "</table><br>";
            }

            document.getElementById("groupResult").innerHTML = html;
        });
}
</script>

</body>
</html>
